<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate" hreflang="en-us" href="{{ .Permalink }}">

    <link rel="alternate" type="application/rss+xml" title="Travis Jeffery's Blog Feed" href="https://travisjeffery.com/rss.xml">
    {{ if .IsHome }}
    <meta property="og:type" content="website">
    <meta property="og:title" content="Travis Jeffery's Homepage">
    {{ else }}
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ .Summary }}">
    <meta property="article:published_time" content="{{ .Date.Format `2006-01-02T15:04:05Z07:00` }}">
    <meta property="article:modified_time" content="{{ .Date.Format `2006-01-02T15:04:05Z07:00` }}">
    {{ end }}
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="Travis Jeffery's Blog">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:site" content="@travisjeffery">
    {{ if .IsHome }}
    <meta name="twitter:text:title" content="Travis Jeffery's Homepage">
    {{ else }}
    <meta name="twitter:text:title" content="{{ .Title }}">
    {{ end }}
    <meta name="twitter:image" content="https://s.gravatar.com/avatar/3ee6c3893e75232ed43ed4e8e9a7cf39">
    <meta name="twitter:card" content="summary">

    {{ $style := resources.Get "css/style.css" | minify }}
    <style>{{ $style.Content | safeCSS }}</style>

    <script>
      (function () {
        var fontHref = 'https://fonts.googleapis.com/css?family=Fira+Code:400,700|Libre+Caslon+Text:400,400i,700&display=swap';
        function loadGoogleFonts() {
          if (document.getElementById('google-fonts-css')) {
            return;
          }
          var link = document.createElement('link');
          link.id = 'google-fonts-css';
          link.rel = 'stylesheet';
          link.href = fontHref;
          document.head.appendChild(link);
        }

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGoogleFonts, { timeout: 2000 });
        } else {
          window.addEventListener('load', loadGoogleFonts, { once: true });
        }
      })();
    </script>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fira+Code:400,700|Libre+Caslon+Text:400,400i,700&display=swap"></noscript>

    <!-- Google tag (gtag.js), deferred until window load to avoid impacting initial render -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      window.addEventListener('load', function () {
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-NJMB3TZ8ZN';
        document.head.appendChild(script);
        gtag('config', 'G-NJMB3TZ8ZN');
      });
    </script>
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}</title>
  </head>
  <body>
    <div class="container-fluid container">
      <div class="row">
        <div class="col-xs-12 col-lg-8 col-lg-offset-2">
          {{ partial "header.html" . }}

          {{ block "main" . }}{{ end }}

          {{ partial "footer.html" . }}
        </div>
      </div>
    </div>
  </body>
</html>
